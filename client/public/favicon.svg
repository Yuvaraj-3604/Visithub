<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="#0f172a"/>
  
  <!-- Hexagonal gateway shape -->
  <path d="M32 6 L50 16 L50 36 L32 46 L14 36 L14 16 Z" fill="none" stroke="#0d9488" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Lanyard clip -->
  <rect x="29" y="10" width="6" height="4" rx="1" fill="#94a3b8"/>
  <line x1="32" y1="6" x2="32" y2="10" stroke="#94a3b8" stroke-width="1.5"/>
  
  <!-- Visitor badge card -->
  <rect x="20" y="14" width="24" height="32" rx="3" fill="#1e293b" stroke="#0d9488" stroke-width="1.5"/>
  
  <!-- Person silhouette circle head -->
  <circle cx="32" cy="24" r="5" fill="#14b8a6"/>
  
  <!-- Person silhouette body -->
  <path d="M25 36 Q25 30 32 30 Q39 30 39 36" fill="#14b8a6"/>
  
  <!-- QR code pattern -->
  <rect x="24" y="39" width="3" height="3" fill="#475569"/>
  <rect x="28" y="39" width="3" height="3" fill="#475569"/>
  <rect x="24" y="43" width="3" height="3" fill="#475569"/>
  <rect x="32" y="39" width="3" height="3" fill="#475569"/>
  <rect x="32" y="43" width="3" height="3" fill="#475569"/>
  <rect x="36" y="39" width="3" height="3" fill="#475569"/>
  <rect x="28" y="43" width="3" height="3" fill="#475569"/>
  <rect x="36" y="43" width="3" height="3" fill="#475569"/>

  <!-- Door hint on right side -->
  <rect x="48" y="20" width="8" height="18" rx="1" fill="none" stroke="#0d9488" stroke-width="1" opacity="0.5"/>
  <circle cx="50" cy="29" r="1" fill="#14b8a6" opacity="0.6"/>
  
  <!-- VH text at bottom -->
  <text x="32" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="9" fill="#e2e8f0">VH</text>
</svg>